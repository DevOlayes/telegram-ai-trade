name: Migration branch build check

on:
  push:
    branches:
      - rebuild/independent-backend-plan
  pull_request:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - '**.sql'
      - '.github/workflows/**'
      - 'migrations/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.*'
      - 'wrangler.jsonc'

concurrency:
  group: migration-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Type-check application
        run: bunx tsc --noEmit
      - name: Lint application
        run: >-
          bunx eslint . --rule 'prettier/prettier: off' --rule '@typescript-eslint/no-explicit-any: off'
