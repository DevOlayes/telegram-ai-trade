name: Migration branch build check

on:
  push:
    branches:
      - rebuild/independent-backend-plan
  pull_request:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - 'bun.lock'
      - 'vite.config.*'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
